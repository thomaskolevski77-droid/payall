plugins {
    id 'fabric-loom' version '1.11.8'
    id 'maven-publish'
}

group = project.maven_group
version = project.mod_version

base {
    archivesName = project.archives_base_name
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
}

processResources {
    inputs.property "version", project.version
    filesMatching("fabric.mod.json") {
        expand "version": project.version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

def pgOut = layout.buildDirectory.dir("proguard")

configurations {
    proguard
}

dependencies {
    proguard "com.guardsquare:proguard-base:7.6.1"
}

tasks.register("proguard", JavaExec) {
    dependsOn tasks.named("remapJar")
    classpath = configurations.proguard
    mainClass = "proguard.ProGuard"
    doFirst { pgOut.get().asFile.mkdirs() }
    args = [
        "@proguard.pro",
        "-injars", tasks.named("remapJar").get().archiveFile.get().asFile.absolutePath,
        "-outjars", pgOut.get().file("PayAll.jar").asFile.absolutePath
    ]
}

def FORBIDDEN = ["pay", "balance", "cmd"]

tasks.register("scanCheck") {
    dependsOn tasks.named("proguard")
    doLast {
        def jar = pgOut.get().file("PayAll.jar").asFile
        if (!jar.exists()) throw new GradleException("missing ${jar}")
        def hits = []
        def zip = new java.util.zip.ZipFile(jar)
        try {
            zip.entries().each { e ->
                if (e.directory) return
                if (!e.name.endsWith(".class")) return
                def text = new String(zip.getInputStream(e).bytes, "ISO-8859-1").toLowerCase()
                FORBIDDEN.each { w -> if (text.contains(w)) hits << "${e.name} -> '${w}'".toString() }
            }
        } finally { zip.close() }
        if (hits) throw new GradleException("leaked:\n  " + hits.join("\n  "))
        logger.lifecycle("scanCheck: clean")
    }
}

tasks.named("check") { dependsOn "scanCheck" }
